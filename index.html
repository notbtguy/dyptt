<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hostel TT Lobby</title>
<style>
html,body{overscroll-behavior:none;-webkit-touch-callout:none;margin:0;height:100%;overflow:hidden;background:linear-gradient(#6fc3ff,#ffd3e6);font-family:'Trebuchet MS',Verdana,sans-serif;touch-action:none;user-select:none}
canvas{display:block}
.ui{position:fixed;left:0;right:0;text-align:center;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 3px 0 #1b1b3a,0 0 14px #1b1b3a}
#score{top:12px;font-size:30px}
#msg{top:38%;font-size:clamp(24px,7vw,34px);padding:0 16px}
#cap{bottom:14%;font-size:26px;letter-spacing:1px;transition:opacity .5s}
#skip{position:fixed;right:14px;bottom:14px;display:none;padding:8px 16px;border:3px solid #1b1b3a;border-radius:20px;background:#fff;font:800 15px inherit;color:#1b1b3a}
#start{position:fixed;inset:0;background:rgba(27,27,58,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
#start h1{font-size:clamp(30px,8vw,64px);margin:0;text-shadow:4px 4px 0 #e0364a}
#start p{max-width:420px;line-height:1.5}
#go{margin-top:12px;padding:14px 40px;font:900 22px inherit;border:4px solid #1b1b3a;border-radius:30px;background:#ffd23f;color:#1b1b3a;box-shadow:0 6px 0 #1b1b3a}
</style></head><body>
<div id="score" class="ui"></div><div id="msg" class="ui"></div><div id="cap" class="ui"></div>
<button id="skip">Skip intro</button>
<div id="start"><h1>D.Y. Patil Hostel<br>TT Lobby</h1><p>The place where every hostelite lost a whole semester. First to 11 wins.</p>
<p id="hint">Move mouse to move the paddle.<br>Click to serve. Swing fast for power.</p><button id="go">Start</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const touch=matchMedia('(pointer:coarse)').matches,V=THREE.Vector3,TOP=.76,R=.05,NET=.9125,PZ=1.9,AZ=-2.0,G=9.8,HR=touch?.52:.4;
const $=id=>document.getElementById(id);
const R_=new THREE.WebGLRenderer({antialias:true,alpha:true});
R_.setPixelRatio(Math.min(devicePixelRatio,touch?1.5:2));R_.setSize(innerWidth,innerHeight);R_.shadowMap.enabled=true;
document.body.appendChild(R_.domElement);
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.05,100);
S.add(new THREE.HemisphereLight(0xffffff,0xffc8d8,.95));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(5,10,6);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,far:30});sun.shadow.mapSize.set(touch?1024:2048,touch?1024:2048);S.add(sun);

// ---------- toon helpers ----------
const grad=new THREE.DataTexture(new Uint8Array([90,170,255]),3,1,THREE.LuminanceFormat);
grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.needsUpdate=true;
const olMat=new THREE.MeshBasicMaterial({color:0x1b1b3a,side:THREE.BackSide});
function mk(g,c,t=.025){
  const m=new THREE.Mesh(g,new THREE.MeshToonMaterial({color:c,gradientMap:grad}));m.castShadow=m.receiveShadow=true;
  if(t){const p=g.parameters,o=new THREE.Mesh(g,olMat);
    p.width?o.scale.set(1+t/p.width,1+t/p.height,1+t/p.depth):o.scale.setScalar(1.06);m.add(o)}
  return m}
function box(w,h,d,c,x,y,z,p=S,t=.025){const m=mk(new THREE.BoxGeometry(w,h,d),c,t);m.position.set(x,y,z);p.add(m);return m}
function cyl(r,h,c,x,y,z,p=S,t=.025,s=14){const m=mk(new THREE.CylinderGeometry(r,r,h,s),c,t);m.position.set(x,y,z);p.add(m);return m}
function label(txt,w,h,x,y,z,ry=0,bg='#fff',fg='#1b1b3a',p=S){
  const c=document.createElement('canvas');c.width=512;c.height=Math.round(512*h/w);const g=c.getContext('2d');
  g.font='900 '+Math.round(c.height*.5)+'px Trebuchet MS';g.textAlign='center';g.textBaseline='middle';
  if(bg){g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);g.strokeStyle=fg;g.lineWidth=8;g.strokeRect(4,4,c.width-8,c.height-8);g.fillStyle=fg;g.fillText(txt,c.width/2,c.height/2)}
  else{g.lineWidth=c.height*.12;g.lineJoin='round';g.strokeStyle='#1b1b3a';g.strokeText(txt,c.width/2,c.height/2);g.fillStyle='#fff';g.fillText(txt,c.width/2,c.height/2)}
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:!bg}));
  m.position.set(x,y,z);m.rotation.y=ry;p.add(m);return m}

// ---------- the lobby ----------
const CREAM=0xfff1c4,RED=0xb5483a,DARK=0x25253a;
box(12,.1,12,0xd3dcf2,0,-.05,0,S,0).castShadow=false;
const grid=new THREE.GridHelper(12,12,0x8aa0d0,0x9fb2dc);grid.position.y=.01;S.add(grid);
function wall(x,z,ry,names=[]){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;S.add(g);
  box(12.4,3.2,.2,CREAM,0,1.6,0,g,0);box(12.4,.9,.22,RED,0,.45,0,g,0);
  [-4,0,4].forEach((cx,i)=>{box(2.8,1.4,.06,0x2f8f5b,cx,1.9,.12,g,0);
    if(names[i]){label(names[i],2.4,.6,cx,2.05,.17,0,null,null,g);label('BEST BACKBENCHER',2,.22,cx,1.5,.17,0,null,null,g)}})}
wall(0,-6.1,0,['Sanidhya','Rushikesh','Shubh']);wall(-6.1,0,Math.PI/2);wall(6.1,0,-Math.PI/2,['Indrajit','Hitendra']);
label('D.Y. PATIL HOSTEL - TT LOBBY',4.6,.5,0,2.95,-5.95,0,'#ffd23f');
for(const[x,z]of[[2,-2],[2,1.8],[-2,-2],[-2,1.8]]){box(.5,3.2,.5,CREAM,x,1.6,z);box(.52,.9,.52,RED,x,.45,z,S,0)}
// entrance stub + notices
box(4,3.2,.2,CREAM,-4,1.6,4.6,S,0);box(4,.9,.22,RED,-4,.45,4.6,S,0);
label('NOTICE',.7,.9,-5,1.7,4.71);label('RULES',.7,.9,-3.8,1.7,4.71);
box(1.2,.05,.7,0xd8d0b0,-4,.75,5.4);for(const dx of[-.55,.55])for(const dz of[-.3,.3])box(.05,.75,.05,DARK,-4+dx,.37,5.4+dz,S,0);
// laundry glass room
{const g=new THREE.Group();g.position.set(-4.6,0,-4.5);S.add(g);
 const gm=new THREE.MeshToonMaterial({color:0xa8d8ee,transparent:true,opacity:.35,gradientMap:grad});
 const a=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.4,.04),gm);a.position.set(0,1.2,1.3);g.add(a);
 const b=new THREE.Mesh(new THREE.BoxGeometry(.04,2.4,2.6),gm);b.position.set(1.3,1.2,0);g.add(b);
 for(const[x,z]of[[-1.3,1.3],[1.3,1.3],[1.3,-1.3]])box(.08,2.4,.08,DARK,x,1.2,z,g,0);
 box(2.7,.08,.08,DARK,0,2.4,1.3,g,0);box(.08,.08,2.7,DARK,1.3,2.4,0,g,0);
}
// dining tables + stools
function dining(x,z){const g=new THREE.Group();g.position.set(x,0,z);S.add(g);
  box(1,.06,2.6,0xaebbd0,0,.8,0,g);
  for(const sx of[-.45,.45])for(const sz of[-1.2,1.2])box(.06,.78,.06,DARK,sx,.39,sz,g,0);
  for(const sx of[-.85,.85])for(const sz of[-.9,0,.9]){cyl(.2,.07,0xdfe6f2,sx,.46,sz,g);cyl(.03,.45,DARK,sx,.23,sz,g,0,8)}}
dining(4,-3.4);dining(4,0);dining(4,3.4);dining(-5,1.2);
cyl(.75,1.5,0x3a4560,5,.75,-5.2,S,.03,24);cyl(.5,.2,0x4a5880,5,1.55,-5.2,S,.03,24);
// fans
const fans=[];
function fan(x,y,z,ry){const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;S.add(g);
  const d=mk(new THREE.CylinderGeometry(.24,.24,.05,16),0xc9ced8);d.rotation.x=Math.PI/2;g.add(d);
  const bl=new THREE.Group();bl.position.z=.06;g.add(bl);
  for(let i=0;i<3;i++){const b=box(.34,.07,.015,0x6c7690,0,0,0,bl,0);b.position.set(Math.cos(i*2.09)*.12,Math.sin(i*2.09)*.12,0);b.rotation.z=i*2.09}
  fans.push(bl)}
fan(-2,2.3,-5.9,0);fan(2.6,2.3,-5.9,0);fan(5.9,2.3,-1,-Math.PI/2);fan(-5.9,2.3,2,Math.PI/2);

// ---------- table tennis table ----------
{const T=new THREE.Group();S.add(T);
 box(1.525,.04,2.74,0x2d5fd0,0,.74,0,T);box(1.4,.1,2.6,0x8a2020,0,.67,0,T,0);
 const wm=0xffffff;box(.02,.003,2.74,wm,-.75,.762,0,T,0);box(.02,.003,2.74,wm,.75,.762,0,T,0);
 box(1.525,.003,.02,wm,0,.762,-1.36,T,0);box(1.525,.003,.02,wm,0,.762,1.36,T,0);box(.01,.003,2.74,wm,0,.762,0,T,0);
 for(const sx of[-.65,.65])for(const sz of[-1.15,1.15])box(.06,.72,.06,0xc22,sx,.36,sz,T,0);
 const nm=new THREE.Mesh(new THREE.BoxGeometry(1.83,.15,.01),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55}));nm.position.set(0,.8365,0);T.add(nm);
 box(1.83,.018,.02,0xffffff,0,.9125,0,T,0);for(const sx of[-.915,.915])box(.03,.17,.03,DARK,sx,.845,0,T,0)}

// ---------- ball, paddles, rival ----------
const ball=mk(new THREE.SphereGeometry(R,16,12),0xffa63d,.012);S.add(ball);const bv=new V();if(touch)ball.scale.setScalar(1.35);
const blob=new THREE.Mesh(new THREE.CircleGeometry(.07,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.35}));blob.rotation.x=-Math.PI/2;S.add(blob);
function paddle(r,c){const g=new THREE.Group();const d=mk(new THREE.CylinderGeometry(r,r,.02,20),c);d.rotation.x=Math.PI/2;g.add(d);
  const h=box(.04,.13,.025,0xd9a35a,0,-r-.05,0,g);S.add(g);return g}
const pad=paddle(.15,0xe0364a),padAI=paddle(.13,0x2a7fe0);
const opp=new THREE.Group();opp.position.set(0,0,-2.6);S.add(opp);
function part(g,c,x,y,z,t=.025){const m=mk(g,c,t);m.position.set(x,y,z);opp.add(m);return m}
part(new THREE.CylinderGeometry(.2,.17,.8,12),0x2a3a6a,0,.4,0);
part(new THREE.CylinderGeometry(.24,.2,.6,12),0xff8fb8,0,1.1,0);
part(new THREE.SphereGeometry(.19,16,12),0xffe0c8,0,1.6,0);
part(new THREE.SphereGeometry(.2,16,12),0x2a2250,0,1.7,-.05);
for(let i=0;i<5;i++){const c=part(new THREE.ConeGeometry(.07,.25,6),0x2a2250,(i-2)*.09,1.92,-.04);c.rotation.z=-(i-2)*.3}
for(const sx of[-.07,.07]){const e=part(new THREE.SphereGeometry(.03,8,8),0x1b1b3a,sx,1.6,.17,0);e.scale.y=1.6}

// ---------- state ----------
let state='menu',server='p',last='p',okBounce=false,aiWill=true,sp=0,sa=0,aiWait=0;
const tmp=new V(),pp=new V(0,1.1,PZ),pv=new V(),aiP=new V(0,1,AZ),lookT=new V(0,.8,-1);
let nx=0,ny=0,bx=0,by=0,sx=0,sy=0,camZ=3.1,AC;
function beep(f,d=.06,v=.15){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=v;
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
const say=t=>$('msg').textContent=t,hud=()=>$('score').textContent='YOU '+sp+'  -  '+sa+' ROOMIE';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function shot(who,tx,tz,T){const p=ball.position;
  bv.set((tx-p.x)/T,(TOP+R-p.y+.5*G*T*T)/T,(tz-p.z)/T);last=who;okBounce=false;state='rally';say('');beep(who==='p'?900:700)}
function hitP(){const sp_=pv.length(),p=ball.position;
  shot('p',clamp(pv.x*.2+(p.x-pp.x)*1.5,-.68,.68),-.5-Math.min(.8,sp_*.12),clamp(.95-sp_*.08,.65,.95))}
function aiHit(){const p=ball.position;shot('a',(Math.random()*2-1)*.62,.35+Math.random()*.65,.8+Math.random()*.2)}
function nextServe(){state='serve';server=Math.floor((sp+sa)/2)%2===0?'p':'a';
  if(server==='p')say('Click / tap to serve');else{say('');aiWait=1.2}}
function point(w){if(state!=='rally')return;state='point';w==='p'?sp++:sa++;hud();
  const over=sp>=11||sa>=11;say(over?(sp>sa?'YOU WIN!':'Roomie wins...'):(w==='p'?'Point!':'Roomie scores'));beep(w==='p'?660:200,.25);
  setTimeout(()=>{if(over){sp=sa=0;hud()}nextServe()},over?3000:1500)}
function step(dt){const p=ball.position,oz=p.z,oy=p.y;
  bv.y-=G*dt;p.addScaledVector(bv,dt);
  if(oz*p.z<0&&p.y<NET&&p.y>TOP-.2&&Math.abs(p.x)<.92){beep(300);return point(last==='p'?'a':'p')}
  if(bv.y<0&&oy>=TOP+R&&p.y<TOP+R&&Math.abs(p.x)<.7625&&Math.abs(p.z)<1.37){
    p.y=TOP+R;bv.y*=-.8;beep(520,.04,.1);
    const side=p.z<0?'a':'p',recv=last==='p'?'a':'p';
    if(side===recv){if(okBounce)return point(last);okBounce=true;if(last==='p')aiWill=Math.random()<.82}
    else return point(last==='p'?'a':'p')}
  if(p.y<R)return point(okBounce?last:(last==='p'?'a':'p'));
  if(last==='a'&&okBounce&&bv.z>0&&oz<PZ&&p.z>=PZ&&Math.hypot(p.x-pp.x,p.y-pp.y)<HR)hitP();
  else if(last==='p'&&okBounce&&aiWill&&bv.z<0&&oz>AZ&&p.z<=AZ&&Math.abs(p.y-aiP.y)<.5&&Math.abs(p.x-aiP.x)<.45)aiHit()}

function game(dt){
  const tx=nx*1.3,ty=1.1+ny*.55,sm=1-Math.exp(-22*dt),ox=pp.x,oy=pp.y;
  pp.x+=(tx-pp.x)*sm;pp.y+=(ty-pp.y)*sm;tmp.set((pp.x-ox)/dt,(pp.y-oy)/dt,0);pv.lerp(tmp,.3);
  pad.position.copy(pp);pad.rotation.z=-pv.x*.04;pad.rotation.x=-.15+pv.y*.02;
  if(state==='rally'&&last==='p'){aiP.x+=(ball.position.x-aiP.x)*Math.min(1,dt*5.5);aiP.y+=(clamp(ball.position.y,.7,1.5)-aiP.y)*Math.min(1,dt*6)}
  else{aiP.x+=(0-aiP.x)*Math.min(1,dt*2);aiP.y+=(1-aiP.y)*Math.min(1,dt*3)}
  padAI.position.copy(aiP);opp.position.x=aiP.x;
  if(state==='rally'){for(let i=0;i<3&&state==='rally';i++)step(dt/3)}
  else{ball.position.addScaledVector(bv,dt);bv.y-=G*dt;
    if(state==='serve'){bv.set(0,0,0);
      if(server==='p')ball.position.set(pp.x,pp.y+.15,pp.z-.12);
      else{ball.position.set(aiP.x,1,AZ+.1);aiWait-=dt;if(aiWait<=0)shot('a',(Math.random()*2-1)*.5,.4+Math.random()*.6,.9)}}
    else if(ball.position.y<R){ball.position.y=R;bv.y*=-.5;bv.x*=.7;bv.z*=.7}}
  const b=ball.position,on=Math.abs(b.x)<.76&&Math.abs(b.z)<1.37&&b.y>TOP;
  blob.position.set(b.x,on?TOP+.004:.012,b.z);blob.scale.setScalar(clamp(1.3-(b.y-(on?TOP:0))*.4,.4,1.2));
  const dp=new V(pp.x*.35,1.5,camZ),dl=new V(pp.x*.2,.8,-1),k=1-Math.exp(-5*dt);
  cam.position.lerp(dp,k);lookT.lerp(dl,k);cam.lookAt(lookT)}

// ---------- cinematic intro ----------
const kp=[[-7,12,12],[-2,11,6],[6,8,5],[5,6,-1],[2.5,3.2,4.5],[0,1.5,3.1]].map(a=>new V(...a));
const kt=[[-4,0,4],[-3,0,1],[4,0,0],[3.5,0,-2],[0,.8,0],[0,.8,-1]].map(a=>new V(...a));
const cp=new THREE.CatmullRomCurve3(kp),ct=new THREE.CatmullRomCurve3(kt);
const caps=[[0,'The Lobby'],[.3,'The Mess & Kitchen'],[.62,'The Arena']];let it=0;const DUR=14;
function intro(dt){it+=dt;const u=Math.min(1,it/DUR),e=u*u*(3-2*u);
  cp.getPoint(e,cam.position);ct.getPoint(e,lookT);cam.lookAt(lookT);
  const c=[...caps].reverse().find(c=>u>=c[0]);$('cap').textContent=c[1];
  if(u>=1)endIntro()}
function endIntro(){state='serve';$('cap').textContent='';$('skip').style.display='none';sp=sa=0;hud();nextServe();ball.position.set(0,1.25,PZ)}

// ---------- input & loop ----------
function ptr(e){
  if(e.pointerType==='mouse'){nx=clamp(e.clientX/innerWidth*2-1,-1,1);ny=clamp(-(e.clientY/innerHeight*2-1),-1,1)}
  else if(e.type==='pointerdown'){sx=e.clientX;sy=e.clientY;bx=nx;by=ny}
  else{nx=clamp(bx+(e.clientX-sx)/innerWidth*2.8,-1,1);ny=clamp(by-(e.clientY-sy)/innerHeight*2.8,-1,1)}}
if(touch)$('hint').innerHTML='Drag anywhere to move the paddle.<br>Tap to serve. Swing fast for power.';
addEventListener('pointermove',ptr);
addEventListener('pointerdown',e=>{ptr(e);
  if(state==='serve'&&server==='p'){const sp_=pv.length();shot('p',clamp(pv.x*.15,-.5,.5),-.6,.9)}});
$('go').onclick=e=>{e.stopPropagation();AC=new(window.AudioContext||window.webkitAudioContext)();$('start').style.display='none';
  state='intro';it=0;$('skip').style.display='block'};
$('skip').onclick=e=>{e.stopPropagation();if(state==='intro')endIntro()};
function fit(){const a=innerWidth/innerHeight;R_.setSize(innerWidth,innerHeight);cam.aspect=a;
  cam.fov=clamp(2*Math.atan(Math.tan(35*Math.PI/180)/a)*180/Math.PI,62,88);camZ=a<1?3.1+Math.min(.9,(1-a)*1.6):3.1;cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();
cam.position.copy(kp[0]);cam.lookAt(kt[0]);
let t0=performance.now();
(function loop(now){const dt=Math.min(.033,(now-t0)/1000)||.016;t0=now;
  if(state==='intro')intro(dt);else if(state!=='menu')game(dt);
  else{it+=dt*.05;cam.position.set(Math.sin(it)*10,10,Math.cos(it)*10);cam.lookAt(0,0,0)}
  fans.forEach(f=>f.rotation.z+=dt*9);
  R_.render(S,cam);requestAnimationFrame(loop)})(t0);
</script></body></html>
